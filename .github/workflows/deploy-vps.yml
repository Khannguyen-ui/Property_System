name: Deploy HomeVerse Production to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Production to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e

            echo "=== Go to project ==="
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "=== Pull latest code from GitHub ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Check required production files ==="
            test -f docker-compose.prod.yml
            test -f .env.prod

            echo "=== Check Docker ==="
            docker --version
            docker compose version

            echo "=== Build Maven jars ==="
            docker run --rm \
              -v "$PWD":/workspace \
              -v maven-repo:/root/.m2 \
              -w /workspace \
              maven:3.9.9-eclipse-temurin-21 \
              mvn clean package -DskipTests

            echo "=== Build production Docker images ==="
            docker compose --env-file .env.prod -f docker-compose.prod.yml build

            echo "=== Start / update production stack without deleting Kafka state ==="
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== Wait for Debezium Connect ==="
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8083/connectors >/dev/null; then
                echo "Debezium Connect is ready"
                break
              fi

              if [ "$i" = "30" ]; then
                echo "Debezium Connect is not ready"
                docker logs --tail=150 debezium-connect || true
                exit 1
              fi

              sleep 5
            done

            echo "=== Register Debezium connectors if missing ==="

            register_connector_if_missing() {
              local name="$1"
              local file="$2"
            
              local http_code
              http_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8083/connectors/$name/status" || true)
            
              if [ "$http_code" = "200" ]; then
              echo "Connector $name already exists"
              return 0
              fi
            
              if [ "$http_code" = "404" ]; then
              echo "Registering connector $name from $file"
              curl -sS -X POST http://localhost:8083/connectors \
              -H "Content-Type: application/json" \
              --data @"$file"
              
              echo
              return 0
              fi
            
              echo "Unexpected status while checking connector $name: HTTP $http_code"
              curl -s "http://localhost:8083/connectors/$name/status" || true
              exit 1
            }

            register_connector_if_missing "customer-db-connector" "kafka/connects/customer-db-connector.json"
            register_connector_if_missing "identity-db-connector" "kafka/connects/debezium-identity.json"
            register_connector_if_missing "property-connector" "kafka/connects/debezium-property-connector.json"

            echo "=== Debezium connector status ==="
            curl -s http://localhost:8083/connectors | python3 -m json.tool
            curl -s http://localhost:8083/connectors/customer-db-connector/status | python3 -m json.tool || true
            curl -s http://localhost:8083/connectors/identity-db-connector/status | python3 -m json.tool || true
            curl -s http://localhost:8083/connectors/property-connector/status | python3 -m json.tool || true

            echo "=== Show containers ==="
            docker ps -a

            echo "=== Initial wait for Spring services boot ==="
            sleep 90

            echo "=== Wait for public routes to become ready ==="
            for i in $(seq 1 60); do
              echo "Health check attempt $i/60..."

              FRONT_OK=0
              OAUTH_OK=0
              CUSTOMER_OK=0

              if curl -fsS -I --max-time 15 https://homeverse-bds.duckdns.org >/dev/null; then
                FRONT_OK=1
              fi

              if curl -fsS -I --max-time 15 https://homeverse-bds.duckdns.org/oauth2/authorization/google -o /tmp/oauth_headers.txt; then
                if grep -qi "Location: https://accounts.google.com" /tmp/oauth_headers.txt; then
                  OAUTH_OK=1
                fi
              fi

              if curl -fsS --max-time 15 https://homeverse-bds.duckdns.org/customers/7/summary >/dev/null; then
                CUSTOMER_OK=1
              fi

              echo "front=$FRONT_OK oauth=$OAUTH_OK customer=$CUSTOMER_OK"

              if [ "$FRONT_OK" = "1" ] && [ "$OAUTH_OK" = "1" ] && [ "$CUSTOMER_OK" = "1" ]; then
                echo "Public routes are ready"
                break
              fi

              if [ "$i" = "60" ]; then
                echo "Services are not ready after waiting. Show diagnostics:"
                docker ps -a
                docker logs --tail=150 identity-service || true
                docker logs --tail=150 customer-service || true
                docker logs --tail=150 search-service || true
                docker logs --tail=150 nginx-proxy || true
                exit 1
              fi

              sleep 10
            done

            echo "=== Cleanup Docker build cache ==="
            docker builder prune -f