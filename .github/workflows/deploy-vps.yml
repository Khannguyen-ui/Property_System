name: Deploy HomeVerse Production to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Production to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "=== Go to project ==="
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "=== Pull latest code from GitHub ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Check required production files ==="
            test -f docker-compose.prod.yml
            test -f .env.prod

            echo "=== Check Docker ==="
            docker --version
            docker compose version

            echo "=== Build Maven jars ==="
            docker run --rm \
              -v "$PWD":/workspace \
              -v maven-repo:/root/.m2 \
              -w /workspace \
              maven:3.9.9-eclipse-temurin-21 \
              mvn clean package -DskipTests

            echo "=== Build production Docker images ==="
            docker compose --env-file .env.prod -f docker-compose.prod.yml build

            echo "=== Start production stack ==="
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

            echo "=== Show containers ==="
            docker ps -a

            echo "=== Cleanup Docker build cache ==="
            docker builder prune -f