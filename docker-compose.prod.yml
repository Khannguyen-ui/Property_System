services:
  postgres:
    image: postgis/postgis:16-3.4
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homeverse-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - homeverse-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - homeverse-network

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - homeverse-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - homeverse-network

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
    env_file:
      - .env.prod
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    networks:
      - homeverse-network

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: customer-service
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    networks:
      - homeverse-network

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    container_name: media-service
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    networks:
      - homeverse-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
      - postgres
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    networks:
      - homeverse-network

  property-service:
    build:
      context: ./property-service
      dockerfile: Dockerfile
    container_name: property-service
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
      - identity-service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/property_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    networks:
      - homeverse-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env.prod
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    networks:
      - homeverse-network

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: search-service
    restart: unless-stopped
    depends_on:
      - kafka
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_ELASTICSEARCH_URIS: ${ELASTIC_CLOUD_URI}
      SPRING_ELASTICSEARCH_API_KEY: ${ELASTIC_CLOUD_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    networks:
      - homeverse-network

  wallet-service:
    build:
      context: ./wallet-service
      dockerfile: Dockerfile
    container_name: wallet-service
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env.prod
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    networks:
      - homeverse-network

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
    env_file:
      - .env.prod
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    networks:
      - homeverse-network

  ai-worker-service:
    build:
      context: .
      dockerfile: ./ai-worker/Dockerfile
    container_name: ai-worker-service
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Ho_Chi_Minh
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SPRING_ELASTICSEARCH_URIS: ${ELASTIC_CLOUD_URI}
      SPRING_ELASTICSEARCH_API_KEY: ${ELASTIC_CLOUD_API_KEY}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    networks:
      - homeverse-network

  recommend-service:
    build:
      context: ./recommend-service
      dockerfile: Dockerfile
    container_name: recommend-service
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    networks:
      - homeverse-network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/homeverse/frontend-dist:/usr/share/nginx/html:ro
      - /opt/homeverse/certbot-www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - identity-service
      - property-service
      - media-service
      - search-service
      - chat-service
      - ai-worker-service
      - recommend-service
    networks:
      - homeverse-network

networks:
  homeverse-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data: