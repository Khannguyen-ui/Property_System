global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "identity-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8081"]

  - job_name: "customer-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["customer-service:8082"]

  - job_name: "media-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["media-service:8084"]

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]

  - job_name: "property-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["property-service:8086"]

  - job_name: "payment-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8087"]

  - job_name: "search-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["search-service:8088"]

  - job_name: "wallet-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["wallet-service:8089"]

  - job_name: "chat-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["chat-service:8090"]

  - job_name: "ai-worker-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ai-worker-service:8091"]

  - job_name: "recommend-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["recommend-service:8092"]