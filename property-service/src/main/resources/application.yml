server:
  port: 8086

spring:
  application:
    name: property-service
  datasource:

    url: jdbc:postgresql://${PROPERTY_DB_HOST:localhost}:5432/property_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # ---> THÊM ĐOẠN KAFKA NÀY VÀO <---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: property-group
      auto-offset-reset: earliest
  data:
    redis:

      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

homeverse:
  services:
    identity: ${IDENTITY_SERVICE_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET}