events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
    listen 80;
    server_name homeverse-bds.duckdns.org 217.217.253.67;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://homeverse-bds.duckdns.org$request_uri;
    }
}
   server {
    listen 443 ssl;
    server_name homeverse-bds.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/homeverse-bds.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homeverse-bds.duckdns.org/privkey.pem;

        client_max_body_size 100M;

        # ==========================================
        # 0. FRONTEND STATIC - React/Vite SPA
        # ==========================================
        root /usr/share/nginx/html;
        index index.html;

        location = /favicon.ico {
            try_files /favicon.ico =204;
        }

        # ==========================================
        # 1. IDENTITY SERVICE
        # ==========================================
        location /auth {
            proxy_pass http://identity-service:8081;
        }

        location /oauth2/ {
            proxy_pass http://identity-service:8081;
        }

        location /login/oauth2/ {
            proxy_pass http://identity-service:8081;
        }

        # KHÔNG dùng location /admin chung nữa,
        # vì /admin/dashboard, /admin/login là route frontend React.
        # Chỉ proxy đúng API admin của identity-service.
        location /admin/users {
            proxy_pass http://identity-service:8081;
        }

        # ==========================================
        # 2. CUSTOMER SERVICE
        # ==========================================
        location /customers {
            proxy_pass http://customer-service:8082;
            client_max_body_size 20M;
        }

        # ==========================================
        # 3. MEDIA SERVICE
        # ==========================================
        location /media {
            proxy_pass http://media-service:8084;
            client_max_body_size 100M;
            client_body_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ==========================================
        # 4. NOTIFICATION SERVICE & WEBSOCKET
        # ==========================================
        location /api/notifications {
            proxy_pass http://notification-service:8085;
        }

        location /ws-notifier {
            proxy_pass http://notification-service:8085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ==========================================
        # 5. PROPERTY SERVICE
        # ==========================================
        location /properties {
            proxy_pass http://property-service:8086;
        }

        location /appointments {
            proxy_pass http://property-service:8086;
        }

        location /comments {
            proxy_pass http://property-service:8086;
        }

        location /interactions {
            proxy_pass http://property-service:8086;
        }

        location /reels {
            proxy_pass http://property-service:8086;
        }

        location /amenities {
            proxy_pass http://property-service:8086;
        }

        location /admin/projects {
            proxy_pass http://property-service:8086;
        }

        location /admin/properties {
            proxy_pass http://property-service:8086;
        }

        location /admin/amenities {
            proxy_pass http://property-service:8086;
        }

        location /admin/master-data/amenities {
            proxy_pass http://property-service:8086;
        }

        location /public/projects {
            proxy_pass http://property-service:8086;
        }

        location /public/properties {
            proxy_pass http://property-service:8086;
        }

        # ==========================================
        # 6. PAYMENT SERVICE
        # ==========================================
        location /api/payment {
            proxy_pass http://payment-service:8087;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/packages {
            proxy_pass http://payment-service:8087;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/admin/packages {
            proxy_pass http://payment-service:8087;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/bills {
            proxy_pass http://payment-service:8087;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/transactions {
            proxy_pass http://payment-service:8087;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ==========================================
        # 7. SEARCH SERVICE
        # ==========================================
        location /search {
            proxy_pass http://search-service:8088;
        }

        location /api/v1/analytics {
            proxy_pass http://search-service:8088;
        }

        # ==========================================
        # 8. WALLET SERVICE
        # ==========================================
        location /api/wallets {
            proxy_pass http://wallet-service:8089;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ==========================================
        # 9. CHAT SERVICE & WEBSOCKET
        # ==========================================
        location /api/chat {
            proxy_pass http://chat-service:8090;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # SockJS/STOMP chat endpoint
        location /ws-chat {
            proxy_pass http://chat-service:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Nếu sau này tách native WebSocket thì dùng route này.
        location /ws-chat-native {
            proxy_pass http://chat-service:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ==========================================
        # 10. RECOMMEND SERVICE
        # ==========================================
        location /recommend {
            proxy_pass http://recommend-service:8092;
        }

        # ==========================================
        # 11. FRONTEND SPA FALLBACK
        # ==========================================
        location / {
            try_files $uri $uri/ /index.html;
        }

    }
}