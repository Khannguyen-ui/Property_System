events {
    worker_connections 1024;
}

http {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # ==========================================
        # 1. IDENTITY SERVICE
        # ==========================================
        location /auth {
            proxy_pass http://identity-service:8081;
        }
        location /admin {
            proxy_pass http://identity-service:8081;
        }

        location /oauth2/ {
            proxy_pass http://identity-service:8081;
        }

        location /login/oauth2/ {
            proxy_pass http://identity-service:8081;
        }

        # ==========================================
        # 2. CUSTOMER SERVICE
        # ==========================================
        location /customers {
            proxy_pass http://customer-service:8082;
            client_max_body_size 20M;
        }

        # ==========================================
        # 3. MEDIA SERVICE
        # ==========================================
        location /media {
            proxy_pass http://media-service:8084;
            client_max_body_size 100M;
            client_body_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ==========================================
        # 4. NOTIFICATION SERVICE & WEBSOCKET
        # ==========================================
        location /api/notifications {
            proxy_pass http://notification-service:8085;
        }

        location /ws-notifier {
            proxy_pass http://notification-service:8085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ==========================================
        # 5. PROPERTY SERVICE
        # ==========================================
        location /properties {
            proxy_pass http://property-service:8086;
        }
        location /amenities {
            proxy_pass http://property-service:8086;
        }
        location /admin/projects {
            proxy_pass http://property-service:8086;
        }
        location /admin/properties {
            proxy_pass http://property-service:8086;
        }
        location /admin/amenities {
            proxy_pass http://property-service:8086;
        }
        location /public/projects {
            proxy_pass http://property-service:8086;
        }
        location /public/properties {
            proxy_pass http://property-service:8086;
        }

        # ==========================================
        # 6. PAYMENT SERVICE (Lưu ý: Port phải khác Property Service nếu chạy riêng)
        # ==========================================
#         location /api/payment/ {
#
#            proxy_pass http://payment-service:8087;
#            proxy_read_timeout 120s;
#            proxy_send_timeout 120s;
#        }
#        location /api/packages/ {
#             proxy_pass http://payment-service:8087;
#             proxy_read_timeout 120s;
#         }
       # ==========================================
        # 7. SEARCH SERVICE
        # ==========================================
        location /search {
            proxy_pass http://search-service:8088;
        }
        location /api/v1/analytics {
            proxy_pass http://search-service:8088;
        }

        # 8. WALLET SERVICE
        # ==========================================
        location /api/wallets {
            proxy_pass http://wallet-service:8089;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
        # ==========================================
        # 9. CHAT SERVICE & WEBSOCKET
        # ==========================================
        
        # Điều hướng các API lấy lịch sử chat, danh sách hội thoại
        location /api/chat {
            proxy_pass http://chat-service:8090;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

         location /ws-chat {
    proxy_pass http://chat-service:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # Các header quan trọng giúp Backend nhận biết Client thật
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

    }
}
