server:
  port: 8092

spring:
  application:
    name: recommend-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:host.docker.internal}:${POSTGRES_PORT:5432}/recommend_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: recommend-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

homeverse:
  services:
    media: ${MEDIA_SERVICE_URL:http://media-service:8084}
    property: ${PROPERTY_SERVICE_URL:http://property-service:8086}
    identity: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
    search: ${SEARCH_SERVICE_URL:http://search-service:8088}
    ml: ${ML_SERVICE_URL:http://recommendation-ml-service:8000}

jwt:
  secret: ${JWT_SECRET:DayLaMotDoanBaoMatRatDaiChoHeThongHomeVerseCuaBan2026DeDungChoThuatToanHS256}

recommendation:
  redis:
    key-prefix: user
  kafka:
    topic:
      user-behavior: user-behavior
      recommendation-update: recommendation-update
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true